<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <title>Product Manager</title>
</head>
<body>
    <div class="crud">
        <div class="head">
            <h2>Product Manager</h2>
            <p>Manage your products</p>
        </div>

        <div class="inputs">
            <input type="text" id="title" placeholder="Title" required>
            
            <div class="price">
               <input type="number" id="price" placeholder="Price" oninput="getTotal()" required>
               <input type="number" id="taxes" placeholder="Taxes" oninput="getTotal()">
               <input type="number" id="ads" placeholder="Ads" oninput="getTotal()">
               <input type="number" id="discount" placeholder="Discount" oninput="getTotal()">
               <small id="total"></small>
            </div>
            
            <input type="number" id="count" placeholder="Count">
            <input type="text" id="category" placeholder="Category" required>
            <button id="submit">Create</button>
        </div>

        <div class="outputs">
            <div class="searchBlock">
                <input type="text" id="search" placeholder="Search" oninput="searchData(this.value)">
                <div class="btnsearch">
                    <button id="searchtitle" onclick="getSearchMode(this.id)">Search Title</button>
                    <button id="searchcategory" onclick="getSearchMode(this.id)">Search Category</button>
                </div>
            </div>
            
            <div id="deleteAll"></div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Taxes</th>
                        <th>Ads</th>
                        <th>Discount</th>
                        <th>Total</th>
                        <th>Category</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <footer>
        <button id="printBtn"><i class="fas fa-file-pdf"></i> Export PDF</button>
    </footer>

    <script src="main.js"></script>
</body>
</html>
